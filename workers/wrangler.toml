name = "aether-funding-webhook"
main = "funding-webhook.js"
compatibility_date = "2026-11-01"

# Run from the workers/ folder. Create the namespace once:
#   wrangler kv namespace create FUNDING_KV
# then paste the printed id below. Secrets are never stored in this file:
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put POLAR_WEBHOOK_SECRET
[[kv_namespaces]]
binding = "FUNDING_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
ALLOWED_ORIGIN = "https://mjeanhudson-dev.github.io"
