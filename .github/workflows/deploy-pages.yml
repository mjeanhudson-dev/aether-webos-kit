name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# One-time setup: repo Settings > Pages > Source = "GitHub Actions".
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (runtime files only)
        run: |
          mkdir -p _site/scripts
          cp index.html scrollcraft.css scrollcraft.js robots.txt sitemap.xml llms.txt a8f4c2e91d7b40639e5a1c8d2f704b3e.txt _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          cp -r assets fonts styles webgl webos context .well-known _site/
          cp scripts/stage-choreography.js _site/scripts/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4